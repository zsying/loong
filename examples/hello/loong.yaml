type: loong.base
config:
  name: hello
children:
  - type: loong.log
    id: logger
    config:
      level: debug
      format: console
  - type: loong.user
    id: users
    config:
      db_path: ./hello.db
  - type: loong.auth
    id: sessions
    config:
      secret: ${LOONG_JWT_SECRET}
  - type: loong.web
    id: main
    config:
      listen: ":8080"
      # optional HTTPS — omit for plain HTTP:
      # tls: { cert: ./cert.pem, key: ./key.pem }
    children:
      # account API (register / login / me) — mount only when the
      # standard password login is wanted.
      - type: loong.web.account
        id: account
      # business components register their own endpoints on the
      # parent's Router in Build.
      - type: biz.greet
        id: greet
        config:
          route: /api/greet
